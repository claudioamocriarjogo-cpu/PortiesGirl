      - name: Instalar Unity Hub 3.22.6 (versao antiga, caminho /opt)
        run: |
          wget -qO - https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub.unity3d.com/linux/repos/deb stable main" > /etc/apt/sources.list.d/unityhub.list'
          printf 'Package: unityhub\nPin: version 3.22.6\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/unityhub >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unityhub=3.22.6 ffmpeg xvfb
          sudo sed -i 's/^\(.*DISPLAY=:.*XAUTHORITY=.*\)\( "\$@" \)2>&1$/\1\2/' /usr/bin/xvfb-run
          if [ ! -x /opt/unityhub/unityhub ] && [ -x /usr/lib/unityhub/unityhub ]; then
            sudo ln -s /usr/lib/unityhub /opt/unityhub
          fi
          printf '#!/bin/bash\nxvfb-run --auto-servernum /opt/unityhub/unityhub "$@" 2>/dev/null' | sudo tee /usr/bin/unity-hub >/dev/null
          sudo chmod 777 /usr/bin/unity-hub
          ls -la /opt/unityhub/unityhub

      - name: Escolher a Unity compativel com o projeto
        env:
          UNITY_VERSION_OVERRIDE: ${{ inputs.unity_version }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request

          vf = os.path.join(os.environ["GITHUB_WORKSPACE"], "project", "ProjectSettings", "ProjectVersion.txt")
          txt = open(vf, encoding="utf-8", errors="ignore").read()
          m = re.search(r"^m_EditorVersion:\s*(\S+)", txt, re.M) or re.search(r"(\d+\.\d+(?:\.\d+)?[a-z]?\d*)", txt)
          orig = m.group(1).strip() if m else "4.0.0f1"
          print("Unity original do projeto:", orig)

          def serie_alvo(v):
              try:
                  major = int(v.split(".")[0])
              except Exception:
                  return "2017.4"
              if major <= 2016: return "2017.4"   # 4.x, 5.x, 2015, 2016
              if major == 2017: return "2017.4"
              if major == 2018: return "2018.4"
              if major == 2019: return "2019.4"
              if major == 2020: return "2020.3"
              if major == 2021: return "2021.3"
              if major in (2022, 2023): return "2022.3"
              return "6000.0"                     # Unity 6 em diante

          ov = os.environ.get("UNITY_VERSION_OVERRIDE", "").strip()
          alvo = ov if ov else serie_alvo(orig)
          print("Serie/versao alvo:", alvo)

          def chave(v):
              mm = re.match(r"(\d+)\.(\d+)\.(\d+)f(\d+)", v)
              return tuple(int(x) for x in mm.groups()) if mm else (0, 0, 0, 0)

          def pega(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "ignore")

          cands = {}

          def varre(o):
              if isinstance(o, dict):
                  v = o.get("version")
                  if isinstance(v, str) and re.fullmatch(r"\d+\.\d+\.\d+f\d+", v):
                      blob = json.dumps(o)
                      c = re.search(r"download_unity/([0-9a-f]{12})/", blob) or re.search(r'"(?:id|shortRevision|changeset)":\s*"([0-9a-f]{12})"', blob)
                      if c: cands[v] = c.group(1)
                  for x in o.values(): varre(x)
              elif isinstance(o, list):
                  for x in o: varre(x)

          # fonte 1: lista de editores Linux usada pelo proprio Unity Hub
          try:
              varre(json.loads(pega("https://public-cdn.cloud.unity3d.com/hub/prod/releases-linux.json")))
          except Exception as e:
              print("Aviso: releases-linux.json falhou:", e)

          def casa(v):
              return v == alvo or v.startswith(alvo + ".")

          escolhidas = [v for v in cands if casa(v)]

          # fonte 2: API publica de releases da Unity
          if not escolhidas:
              for stream in ("LTS", ""):
                  try:
                      q = "https://services.api.unity.com/unity/editor/release/v1/releases?limit=25&order=RELEASE_DATE_DESC&version=" + alvo
                      if stream: q += "&stream=" + stream
                      varre(json.loads(pega(q)))
                  except Exception as e:
                      print("Aviso: API de releases falhou:", e)
                  escolhidas = [v for v in cands if casa(v)]
                  if escolhidas: break

          if not escolhidas:
              print("::error::Nao achei nenhuma Unity da serie " + alvo + ". Rode de novo informando unity_version (ex.: 2021.3).")
              sys.exit(1)

          ver = max(escolhidas, key=chave)
          rev = cands[ver]
          open(vf, "w", encoding="utf-8").write("m_EditorVersion: %s\nm_EditorVersionWithRevision: %s (%s)\n" % (ver, ver, rev))
          print("Unity escolhida: %s (%s)  [original: %s]" % (ver, rev, orig))
          PYEOF
          cat project/ProjectSettings/ProjectVersion.txt

