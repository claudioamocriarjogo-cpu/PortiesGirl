name: decompile

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  GAME_TAG: apkGame

jobs:
  decompile:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'apkGame'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o jogo ou APK da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          if ! gh release download "$GAME_TAG" --repo "$GITHUB_REPOSITORY" --dir input --pattern '*.zip' --pattern '*.7z' --pattern '*.rar' --pattern '*.apk'; then
            echo "::error::Nenhum jogo ou APK encontrado na tag '$GAME_TAG'. Anexe o .zip, .7z, .rar ou .apk na release."
            exit 1
          fi
          ls -lh input

      - name: Extrair o jogo ou APK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full unar
          mkdir -p game
          for f in input/*; do
            TIPO=$(file -b --mime-type "$f")
            echo "Extraindo $f ($TIPO)"
            case "$f" in
              *.apk)
                7z x -y -o"game/$(basename "$f" .apk)" "$f" >/dev/null
                ;;
              *)
                case "$TIPO" in
                  application/*rar*) unar -q -o game "$f" ;;
                  *) 7z x -y -ogame "$f" >/dev/null ;;
                esac
                ;;
            esac
          done
          find game -maxdepth 2 | head -30 || true

      - name: Detectar o tipo do conteúdo
        run: |
          UNITY_DATA=$(find game -maxdepth 5 -type d \( -name '*_Data' -o -path '*/assets/bin/Data' \) -print -quit)
          IS_UNITY=false
          if [ -n "$UNITY_DATA" ]; then
            IS_UNITY=true
            case "$UNITY_DATA" in
              */assets/bin/Data) UNITY_ROOT="${UNITY_DATA%/assets/bin/Data}" ;;
              *) UNITY_ROOT="$(dirname "$UNITY_DATA")" ;;
            esac
            echo "UNITY_ROOT=$(realpath "$UNITY_ROOT")" >> "$GITHUB_ENV"
            echo "Pasta Unity encontrada: $UNITY_DATA"
          fi
          HAS_APK=false
          if compgen -G "input/*.apk" > /dev/null; then HAS_APK=true; fi
          if [ "$IS_UNITY" = false ] && [ "$HAS_APK" = false ]; then
            echo "::error::Não achei a pasta *_Data nem um .apk. Não parece ser um jogo Unity."
            exit 1
          fi
          echo "IS_UNITY=$IS_UNITY" >> "$GITHUB_ENV"
          echo "HAS_APK=$HAS_APK" >> "$GITHUB_ENV"
          echo "Unity: $IS_UNITY | APK: $HAS_APK"

      - name: Baixar o jadx
        if: env.HAS_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools
          gh release download --repo skylot/jadx --dir tools --pattern 'jadx-[0-9]*.zip'
          JADX_ZIP=$(ls tools/jadx-[0-9]*.zip | head -1)
          unzip -q "$JADX_ZIP" -d tools/jadx
          JADX_PATH=$(find tools/jadx -path '*/bin/jadx' -type f | head -1)
          test -n "$JADX_PATH" || { echo "::error::jadx não encontrado no pacote"; exit 1; }
          chmod +x "$JADX_PATH"
          echo "JADX_BIN=$(realpath "$JADX_PATH")" >> "$GITHUB_ENV"

      - name: Decompilar o APK com jadx
        if: env.HAS_APK == 'true'
        run: |
          mkdir -p java
          for APK in input/*.apk; do
            NAME=$(basename "$APK" .apk)
            echo "jadx: $APK"
            "$JADX_BIN" -d "java/$NAME" "$APK" || echo "::warning::jadx terminou com erros em $APK"
          done
          (cd java && zip -qr ../ApkJava.zip .)
          ls -lh ApkJava.zip

      - name: Baixar o AssetRipper (última versão, Linux)
        if: env.IS_UNITY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ripper
          ASSET=""; TAG=""
          for T in $(gh api "repos/AssetRipper/AssetRipper/releases?per_page=15" --jq '.[] | select(.prerelease==false) | .tag_name'); do
            A=$(gh release view "$T" --repo AssetRipper/AssetRipper --json assets --jq '.assets[].name' | grep -iE 'linux' | grep -iE '\.(zip|tar\.xz|tar\.gz|tgz)$' | grep -viE 'arm' | head -1 || true)
            if [ -n "$A" ]; then ASSET="$A"; TAG="$T"; break; fi
          done
          if [ -z "$ASSET" ]; then
            echo "::error::Nenhum arquivo Linux achado nas releases do AssetRipper. Arquivos da última release:"
            gh release view --repo AssetRipper/AssetRipper --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "Usando $TAG / $ASSET"
          gh release download "$TAG" --repo AssetRipper/AssetRipper --dir ripper --pattern "$ASSET"
          case "$ASSET" in
            *.zip) unzip -q "ripper/$ASSET" -d ripper ;;
            *) tar -xf "ripper/$ASSET" -C ripper ;;
          esac
          RIPPER_BIN=$(find ripper -type f \( -name 'AssetRipper.GUI.Free' -o -name 'AssetRipper.GUI' -o -name 'AssetRipper' \) | head -1)
          test -n "$RIPPER_BIN" || { echo "::error::Executável do AssetRipper não encontrado"; find ripper -maxdepth 3 -type f | head -30; exit 1; }
          chmod +x "$RIPPER_BIN"
          echo "RIPPER_BIN=$(realpath "$RIPPER_BIN")" >> "$GITHUB_ENV"

      - name: Rodar o AssetRipper e exportar o projeto Unity
        if: env.IS_UNITY == 'true'
        run: |
          OUT_DIR="$(pwd)/out"
          mkdir -p "$OUT_DIR"
          echo "Jogo: $UNITY_ROOT"

          "$RIPPER_BIN" --headless --port 5000 > ripper.log 2>&1 &
          RIPPER_PID=$!

          UP=0
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:5000/; then UP=1; break; fi
            if ! kill -0 "$RIPPER_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::AssetRipper não subiu o servidor na porta 5000"
            tail -50 ripper.log
            exit 1
          fi

          CODE=$(curl -sS --max-time 1800 -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:5000/LoadFolder --data-urlencode "path=$UNITY_ROOT")
          echo "LoadFolder: HTTP $CODE"
          case "$CODE" in 2*|3*) ;; *) echo "::error::LoadFolder falhou (HTTP $CODE)"; tail -50 ripper.log; exit 1 ;; esac

          CODE=$(curl -sS --max-time 3600 -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:5000/Export/UnityProject --data-urlencode "path=$OUT_DIR")
          echo "Export: HTTP $CODE"
          case "$CODE" in 2*|3*) ;; *) echo "::error::Export falhou (HTTP $CODE)"; tail -50 ripper.log; exit 1 ;; esac

          kill "$RIPPER_PID" 2>/dev/null || true
          test -n "$(ls -A "$OUT_DIR")" || { echo "::error::A exportação ficou vazia"; exit 1; }
          du -sh "$OUT_DIR"

      - name: Compactar o projeto Unity
        if: env.IS_UNITY == 'true'
        run: |
          cd out
          zip -qr ../ProjetoUnity.zip .
          ls -lh ../ProjetoUnity.zip

      - name: Enviar o projeto Unity
        if: env.IS_UNITY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoUnity
          path: ProjetoUnity.zip
          compression-level: 0
          if-no-files-found: error

      - name: Enviar o código Java do APK
        if: always() && env.HAS_APK == 'true' && hashFiles('ApkJava.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ApkJava
          path: ApkJava.zip
          if-no-files-found: error

      - name: Logs do AssetRipper (em caso de erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ripper-log
          path: ripper.log
          if-no-files-found: warn
