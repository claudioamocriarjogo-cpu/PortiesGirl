- name: Baixar o AssetRipper (última versão, Linux)
  run: |
    mkdir -p ripper
    echo "Assets disponíveis na última release:"
    gh release view --repo AssetRipper/AssetRipper --json tagName,assets \
      -q '.tagName, (.assets[].name)'

    ASSET=$(gh release view --repo AssetRipper/AssetRipper --json assets \
      -q '.assets[].name' | grep -iE 'linux.*(x64|amd64)' | grep -iE '\.(zip|tar\.gz)$' | head -1)
    if [ -z "$ASSET" ]; then
      echo "::error::Nenhum asset Linux x64 encontrado na última release."
      exit 1
    fi
    gh release download --repo AssetRipper/AssetRipper --dir ripper --pattern "$ASSET"

    case "$ASSET" in
      *.zip)    unzip -q "ripper/$ASSET" -d ripper ;;
      *.tar.gz) tar -xzf "ripper/$ASSET" -C ripper ;;
    esac

    RIPPER_BIN=$(find ripper -type f \( -name 'AssetRipper.GUI.Free' -o -name 'AssetRipper.GUI*' -o -name 'AssetRipper' \) ! -name '*.dll' ! -name '*.pdb' | head -1)
    [ -n "$RIPPER_BIN" ] || { echo "::error::Binário não encontrado"; find ripper -maxdepth 2; exit 1; }
    chmod +x "$RIPPER_BIN"
    echo "RIPPER_BIN=$RIPPER_BIN" >> "$GITHUB_ENV"
  env:
    GH_TOKEN: ${{ github.token }}
